name: CI/CD Pipeline - DEV and TEST Tomcat

on:
  push:
    branches:
      - main

jobs:

  # =========================
  # BUILD
  # =========================
  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 3. Build WAR
      - name: Build Application
        run: mvn clean package -DskipTests

      # 4. Rename WAR for DEV
      - name: Prepare DEV WAR
        run: cp target/*.war TrainBook-Dev.war

      # 5. Rename WAR for TEST
      - name: Prepare TEST WAR
        run: cp target/*.war TrainBook-Test.war

      # 6. Upload WAR files
      - name: Upload WAR files
        uses: actions/upload-artifact@v4
        with:
          name: trainbook-wars
          path: |
            TrainBook-Dev.war
            TrainBook-Test.war


  # =========================
  # DEV DEPLOYMENT
  # =========================
  deploy-dev:
    name: Deploy to DEV Tomcat
    needs: build
    runs-on: ubuntu-latest

    steps:

      # Download WAR files
      - name: Download WAR files
        uses: actions/download-artifact@v4
        with:
          name: trainbook-wars

      # Copy DEV WAR to server
      - name: Copy DEV WAR
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          source: "TrainBook-Dev.war"
          target: "/home/ubuntu/"

      # Deploy DEV WAR
      - name: Deploy DEV WAR and Restart Tomcat
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          script: |

            TOMCAT=/root/tomcat/apache-tomcat-10.1.59

            # Remove previous DEV deployment
            sudo rm -rf $TOMCAT/webapps/TrainBook-Dev
            sudo rm -f $TOMCAT/webapps/TrainBook-Dev.war

            # Copy new WAR
            sudo mv /home/ubuntu/TrainBook-Dev.war $TOMCAT/webapps/TrainBook-Dev.war

            # Restart Tomcat
            sudo $TOMCAT/bin/shutdown.sh || true
            sleep 5
            sudo $TOMCAT/bin/startup.sh


  # =========================
  # TEST DEPLOYMENT
  # =========================
  deploy-test:
    name: Deploy to TEST Tomcat
    needs: deploy-dev
    runs-on: ubuntu-latest

    steps:

      # Download WAR files
      - name: Download WAR files
        uses: actions/download-artifact@v4
        with:
          name: trainbook-wars

      # Copy TEST WAR to server
      - name: Copy TEST WAR
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.TEST_HOST }}
          username: ${{ secrets.TEST_USER }}
          key: ${{ secrets.TEST_SSH_KEY }}
          source: "TrainBook-Test.war"
          target: "/home/ubuntu/"

      # Deploy TEST WAR
      - name: Deploy TEST WAR and Restart Tomcat
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.TEST_HOST }}
          username: ${{ secrets.TEST_USER }}
          key: ${{ secrets.TEST_SSH_KEY }}
          script: |

            TOMCAT=/root/tomcat/apache-tomcat-10.1.59

            # Remove previous TEST deployment
            sudo rm -rf $TOMCAT/webapps/TrainBook-Test
            sudo rm -f $TOMCAT/webapps/TrainBook-Test.war

            # Copy new WAR
            sudo mv /home/ubuntu/TrainBook-Test.war $TOMCAT/webapps/TrainBook-Test.war

            # Restart Tomcat
            sudo $TOMCAT/bin/shutdown.sh || true
            sleep 5
            sudo $TOMCAT/bin/startup.sh
