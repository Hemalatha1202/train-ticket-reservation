name: CI/CD Pipeline - Tomcat Deployment

on:
  push:
    branches:
      - main

jobs:

  # ==========================================================
  # BUILD
  # ==========================================================
  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 3. Build WAR
      - name: Build Application
        run: mvn clean package -DskipTests

      # 4. Upload WAR as GitHub Artifact
      - name: Upload WAR
        uses: actions/upload-artifact@v4
        with:
          name: trainbook-war
          path: target/*.war


  # ==========================================================
  # DEV
  # ==========================================================
  deploy-dev:
    name: Deploy to DEV
    needs: build
    runs-on: ubuntu-latest

    steps:

      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: trainbook-war
          path: war

      - name: Copy WAR to DEV Server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          source: "war/*.war"
          target: "/home/ubuntu/"
          strip_components: 1

      - name: Deploy to DEV Tomcat
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          script: |

            TOMCAT=/root/tomcat/apache-tomcat-10.1.59

            sudo rm -rf $TOMCAT/webapps/TrainBook-Dev
            sudo rm -f $TOMCAT/webapps/TrainBook-Dev.war

            sudo mv /home/ubuntu/*.war $TOMCAT/webapps/TrainBook-Dev.war

            sudo $TOMCAT/bin/shutdown.sh || true
            sleep 5
            sudo $TOMCAT/bin/startup.sh


  # ==========================================================
  # TEST
  # ==========================================================
  deploy-test:
    name: Deploy to TEST
    needs: deploy-dev
    runs-on: ubuntu-latest

    steps:

      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: trainbook-war
          path: war

      - name: Copy WAR to TEST Server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.TEST_HOST }}
          username: ${{ secrets.TEST_USER }}
          key: ${{ secrets.TEST_SSH_KEY }}
          source: "war/*.war"
          target: "/home/ubuntu/"
          strip_components: 1

      - name: Deploy to TEST Tomcat
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.TEST_HOST }}
          username: ${{ secrets.TEST_USER }}
          key: ${{ secrets.TEST_SSH_KEY }}
          script: |

            TOMCAT=/root/tomcat/apache-tomcat-10.1.59

            sudo rm -rf $TOMCAT/webapps/TrainBook-Test
            sudo rm -f $TOMCAT/webapps/TrainBook-Test.war

            sudo mv /home/ubuntu/*.war $TOMCAT/webapps/TrainBook-Test.war

            sudo $TOMCAT/bin/shutdown.sh || true
            sleep 5
            sudo $TOMCAT/bin/startup.sh


  # ==========================================================
  # PRE-PROD
  # ==========================================================
  deploy-preprod:
    name: Deploy to PRE-PROD
    needs: deploy-test
    runs-on: ubuntu-latest

    steps:

      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: trainbook-war
          path: war

      - name: Copy WAR to PRE-PROD Server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.PREPROD_HOST }}
          username: ${{ secrets.PREPROD_USER }}
          key: ${{ secrets.PREPROD_SSH_KEY }}
          source: "war/*.war"
          target: "/home/ubuntu/"
          strip_components: 1

      - name: Deploy to PRE-PROD Tomcat
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PREPROD_HOST }}
          username: ${{ secrets.PREPROD_USER }}
          key: ${{ secrets.PREPROD_SSH_KEY }}
          script: |

            TOMCAT=/root/tomcat/apache-tomcat-10.1.59

            sudo rm -rf $TOMCAT/webapps/TrainBook-PreProd
            sudo rm -f $TOMCAT/webapps/TrainBook-PreProd.war

            sudo mv /home/ubuntu/*.war $TOMCAT/webapps/TrainBook-PreProd.war

            sudo $TOMCAT/bin/shutdown.sh || true
            sleep 5
            sudo $TOMCAT/bin/startup.sh


  # ==========================================================
  # PROD
  # ==========================================================
  deploy-prod:
    name: Deploy to PROD
    needs: deploy-preprod
    runs-on: ubuntu-latest

    steps:

      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: trainbook-war
          path: war

      - name: Copy WAR to PROD Server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          source: "war/*.war"
          target: "/home/ubuntu/"
          strip_components: 1

      - name: Deploy to PROD Tomcat
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |

            TOMCAT=/root/tomcat/apache-tomcat-10.1.59

            sudo rm -rf $TOMCAT/webapps/TrainBook-Prod
            sudo rm -f $TOMCAT/webapps/TrainBook-Prod.war

            sudo mv /home/ubuntu/*.war $TOMCAT/webapps/TrainBook-Prod.war

            sudo $TOMCAT/bin/shutdown.sh || true
            sleep 5
            sudo $TOMCAT/bin/startup.sh
